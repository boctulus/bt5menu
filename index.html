<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Admin Menu</title>

    <!-- Bootstrap CSS -->
    <link href="assets/third_party/bootstrap-5.3/bootstrap.min.css" rel="stylesheet">

    <!-- AsideMenu -->
    <link href="assets/css/asidemenu.css" rel="stylesheet">

    <!-- Profile card -->
    <link href="assets/css/profile.css" rel="stylesheet">

    <!-- Theme -->
    <!-- link href="assets/css/custom_theme.css" rel="stylesheet" -->

    <!-- Feather -->
    <script src="assets/third_party/feathericons/feather.min.js"></script>

    <!-- Pulled from Backend, probably using Ajax request (included here as part of a demo) -->
    <script src="assets/js/menu_items.js"></script>

    <!-- AsideMenu -->
    <script src="assets/js/asidemenu.js"></script>

    <style>
        /*
            Possible CSS adjustments
        */

        body {
            background-color: #E9F0F1; 
            color: #333333;
        }

        #content {
            transition: margin-left 0.3s;
            padding-top: 80px !important;
            background-color: transparent;
            min-height: 100vh;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 6000;
            height: 102vh;
            background: linear-gradient(180deg, #8B7FD8 0%, #7B6FD8 40%, #6B7CBA 100%);
            width: 86px;
        }

        #asidemenu .counter {
            color: white;
        }

    </style>
</head>
<body>
    <!-- Navbar demo -->
    <!-- Navbar con el icono de hamburguesa -->
    <nav class="navbar navbar-dark fixed-top" style="background: linear-gradient(90deg, #9B8FE8 0%, #7B6FD8 50%, #6B8CCA 100%);">
        <div class="container-fluid">
            <button id="sidebarCollapse" class="navbar-toggler" type="button">
                <span class="navbar-toggler-icon custom-toggler"></span>
            </button>
        </div>
    </nav>

    <!-- Sidebar (Aside Menu) -->
    <aside id="sidebar">
        <div id="asidemenu" class="collapsed">
            <!-- Content to be generated dynamically -->
        </div>
    </aside>

    <!-- Botón de cierre para móvil -->
    <button id="mobile-close-btn" onclick="menu.collapseSidebar()" aria-label="Cerrar menú">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
    
    <!-- Content -->
    <div id="content" class="p-4">
        <div class="container">
            <h2 class="mb-3">Lorem Ipsum</h2>
            <p>Neque porro quisquam est ...</p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="assets/third_party/bootstrap-5.3/bootstrap.bundle.min.js"></script>
    
    <script>
        // custom callback
        function logout() {
            alert('Performing log-out');
        }

        const menu_config = {
            "starts_expanded": false,
            "options_starts_expanded": false,  /* it has only effect if starts_expanded is true */
            "role": "admin"
        };

        /*
            AsideMenu init
        */

        const menu = new AsideMenu(menu_items, menu_config);
        
        menu.setOnExpandHandler(() => {
            // Username animation
            const nameElement = document.querySelector('.name');
            if (nameElement) {
                nameElement.classList.add('reveal-text');
            }

            // Toggle icon animation
            const toggleIcon = document.querySelector('.toggle-btn svg');
            if (toggleIcon) {
                toggleIcon.classList.remove('rotate-counterclockwise');
                toggleIcon.classList.add('rotate-clockwise');
            }
        });


        menu.setOnCollapseHandler(() => {
            // Username animation
            const nameElement = document.querySelector('.name');
            if (nameElement) {
                nameElement.classList.remove('reveal-text');
            }

            // Toggle icon animation
            const toggleIcon = document.querySelector('.toggle-btn svg');
            if (toggleIcon) {
                toggleIcon.classList.remove('rotate-clockwise');
                toggleIcon.classList.add('rotate-counterclockwise');
            }
        });
        
        
        menu.init();

        document.addEventListener('DOMContentLoaded', () => {
            // Feather icons
            feather.replace();

            // Establecer la posición inicial del toggle icon
            const toggleIcon = document.querySelector('.toggle-btn svg');
            if (toggleIcon) {
                toggleIcon.classList.add('rotate-counterclockwise');
            }

            // Conectar el botón de hamburguesa con el toggle del menú
            document.getElementById('sidebarCollapse').addEventListener('click', () => {
                menu.toggleSidebar();
            });
        });
        
    </script>
</body>
</html>
